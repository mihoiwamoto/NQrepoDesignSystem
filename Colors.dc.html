<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; background: #ffffff; }

    <div>
      <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 12px 0; color: #1a1a1a;">Green</h3>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; height: 36px; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">

          <div style="flex: 1; background: #005528;"></div>
          <div style="flex: 1; background: #006D32;"></div>
          <div style="flex: 1; background: #00853C;"></div>
          <div style="flex: 1; background: #009944;"></div>

    </div>

      <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 12px 0; color: #1a1a1a;">Light Green</h3>

        <div style="display: flex; height: 36px; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">

          <div style="flex: 1; background: #3ED97A;"></div>
          <div style="flex: 1; background: #6EE39D;"></div>
          <div style="flex: 1; background: #A3EDC1;"></div>
          <div style="flex: 1; background: #CFF6DF;"></div>
          <div style="flex: 1; background: #E9FBF0;"></div>

    </div>

    </div>

    <h3 style="font-size: 14px; font-weight: 600; margin: 0 0 12px 0; color: #1a1a1a;">ニュートラルカラー</h3>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">

        <div style="width: 32px; height: 32px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 4px;"></div>
